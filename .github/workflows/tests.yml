name: Python unit tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test game rules and retained Sprint 0 deck
        run: python -m unittest sprint2.test_game sprint3.tests.test_game sprint3.tests.test_recording test_deck -v
      - name: Install Tkinter and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Test both graphical interfaces
        run: xvfb-run -a python -m unittest sprint2.test_gui sprint3.tests.test_gui -v
