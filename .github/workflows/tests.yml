name: Python unit tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test game rules and retained Sprint 0 deck
        run: python -m unittest sprint2.test_game test_deck -v
